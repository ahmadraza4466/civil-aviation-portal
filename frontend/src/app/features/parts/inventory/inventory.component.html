<div class="av-page">

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <div class="page-eyebrow">Spare Parts</div>
            <h1 class="page-title"><i class="bi bi-boxes"></i>Spare Parts Inventory</h1>
            <p class="page-subtitle">Track, manage, and audit simulator spare parts stock</p>
        </div>
        <div class="page-header-actions">
            <div class="dropdown">
                <button class="btn btn-outline-darker btn-pill dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-funnel me-1"></i>{{ selectedDevice || 'All Systems' }}
                </button>
                <ul class="dropdown-menu dropdown-menu-end"
                    style="background-color: #1e2638; border: 1px solid rgba(255,255,255,0.08); border-radius: 0.75rem; min-width: 190px;">
                    <li>
                        <a class="dropdown-item text-secondary py-2" href="javascript:void(0)" (click)="filterByDevice('')">
                            <i class="bi bi-grid me-2 opacity-50"></i>All Systems
                        </a>
                    </li>
                    <li><hr class="dropdown-divider my-1" style="border-color: rgba(255,255,255,0.08);"></li>
                    <li *ngFor="let device of deviceOptions">
                        <a class="dropdown-item py-2"
                            [class.text-info]="selectedDevice === device"
                            [class.text-light]="selectedDevice !== device"
                            href="javascript:void(0)" (click)="filterByDevice(device)">
                            <i class="bi bi-check2 me-2" [style.visibility]="selectedDevice === device ? 'visible' : 'hidden'"></i>{{ device }}
                        </a>
                    </li>
                </ul>
            </div>
            <button class="btn btn-neon-blue btn-pill px-4" (click)="onAdd()">
                <i class="bi bi-plus-lg me-1"></i>Add Part
            </button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="stat-label">Total Parts</span>
                <div class="sc-stat-icon" style="background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.2);">
                    <i class="bi bi-boxes" style="color:#3b82f6;"></i>
                </div>
            </div>
            <strong class="stat-value" style="color:#3b82f6;">{{ totalParts }}</strong>
            <small class="stat-sub">In catalogue</small>
        </div>
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="stat-label">Low Stock</span>
                <div class="sc-stat-icon" style="background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.2);">
                    <i class="bi bi-exclamation-triangle-fill" style="color:#f59e0b;"></i>
                </div>
            </div>
            <strong class="stat-value" style="color:#f59e0b;">{{ lowStockCount }}</strong>
            <small class="stat-sub">Below threshold</small>
        </div>
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="stat-label">Out of Stock</span>
                <div class="sc-stat-icon" style="background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.2);">
                    <i class="bi bi-x-circle-fill" style="color:#ef4444;"></i>
                </div>
            </div>
            <strong class="stat-value" style="color:#ef4444;">{{ outOfStockCount }}</strong>
            <small class="stat-sub">Needs replenishment</small>
        </div>
    </div>

    <!-- Table Card -->
    <div class="content-card">
        <div class="content-card-header">
            <h6 class="content-card-title"><i class="bi bi-list-check me-2"></i>Spare Parts List</h6>
        </div>
        <app-reusable-table [columns]="tableColumns" [data]="filteredParts" [itemsPerPage]="10"
            (view)="onViewHistory($event)" (edit)="onEdit($event)" (delete)="onDelete($event)">
        </app-reusable-table>
    </div>

</div>

<div class="av-page">

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <div class="page-eyebrow">Defect Management</div>
            <h1 class="page-title"><i class="bi bi-tools"></i>Case Registry</h1>
            <p class="page-subtitle">Log, track, and resolve simulator defect cases</p>
        </div>
        <div class="page-header-actions">
            <div class="dropdown">
                <button class="btn btn-outline-darker btn-pill dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-funnel me-1"></i>{{ selectedDevice || 'All Devices' }}
                </button>
                <ul class="dropdown-menu dropdown-menu-end"
                    style="background-color: #1e2638; border: 1px solid rgba(255,255,255,0.08); border-radius: 0.75rem; min-width: 170px;">
                    <li>
                        <a class="dropdown-item text-secondary py-2" href="javascript:void(0)" (click)="filterByDevice('')">
                            <i class="bi bi-grid me-2 opacity-50"></i>All Devices
                        </a>
                    </li>
                    <li><hr class="dropdown-divider my-1" style="border-color: rgba(255,255,255,0.08);"></li>
                    <li *ngFor="let device of deviceOptions">
                        <a class="dropdown-item py-2"
                            [class.text-info]="selectedDevice === device"
                            [class.text-light]="selectedDevice !== device"
                            href="javascript:void(0)" (click)="filterByDevice(device)">
                            <i class="bi bi-check2 me-2" [style.visibility]="selectedDevice === device ? 'visible' : 'hidden'"></i>{{ device }}
                        </a>
                    </li>
                </ul>
            </div>
            <button class="btn btn-neon-blue btn-pill px-4" (click)="onAdd()">
                <i class="bi bi-plus-lg me-1"></i>Enter new case
            </button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="stat-label">Total Cases</span>
                <div class="sc-stat-icon" style="background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.2);">
                    <i class="bi bi-folder2-open" style="color:#3b82f6;"></i>
                </div>
            </div>
            <strong class="stat-value" style="color:#3b82f6;">{{ totalCases }}</strong>
            <small class="stat-sub">All records</small>
        </div>
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="stat-label">Open Cases</span>
                <div class="sc-stat-icon" style="background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.2);">
                    <i class="bi bi-exclamation-circle-fill" style="color:#f59e0b;"></i>
                </div>
            </div>
            <strong class="stat-value" style="color:#f59e0b;">{{ openCasesCount }}</strong>
            <small class="stat-sub">Pending resolution</small>
        </div>
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="stat-label">Closed Cases</span>
                <div class="sc-stat-icon" style="background:rgba(16,185,129,0.12);border-color:rgba(16,185,129,0.2);">
                    <i class="bi bi-check-circle-fill" style="color:#10b981;"></i>
                </div>
            </div>
            <strong class="stat-value" style="color:#10b981;">{{ closedCasesCount }}</strong>
            <small class="stat-sub">Resolved</small>
        </div>
    </div>

    <!-- Table Card -->
    <div class="content-card">
        <div class="content-card-header">
            <h6 class="content-card-title"><i class="bi bi-list-check me-2"></i>Snag Case List</h6>
        </div>
        <app-reusable-table [columns]="tableColumns" [data]="filteredCases" [itemsPerPage]="10"
            (edit)="onEdit($event)" (delete)="onDelete($event)">
        </app-reusable-table>
    </div>

</div>
